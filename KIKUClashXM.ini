;节点细化
custom_proxy_group=自动选择`url-test`^(.(?!(-0|套餐)))*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=HK香港节点`url-test`(?=.*(港))^((?!(-0)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=TW台湾节点`url-test`(?=.*(台))^((?!(-0)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP日本节点`url-test`(?=.*(日本))^((?!(-0|4x)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG新加坡节点`url-test`(?=.*(新加))^((?!(-0)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=US美国节点`url-test`(?=.*(美))^((?!(-0|2x|4x)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=福利`url-test`(?=.*(港|台|新加))^((?!(-1|01|02|03)).)*$`http://www.gstatic.com/generate_204`300,,1
custom_proxy_group=无限流`load-balance`(?=.*(港|台))^((?!(-香|-台|港-01|-03)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=索尼`select`.*
custom_proxy_group=任天堂`select`.*
custom_proxy_group=奈飞节点`select`.*
custom_proxy_group=手动选择`select`.*
custom_proxy_group=纯净`select`(2x|4x)
